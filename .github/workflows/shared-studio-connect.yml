name: Shared Studio social connections
on:
  pull_request:
    paths:
      - 'studio-connect/**'
      - 'studio-v1/index.html'
      - 'foxon-studio/index.html'
      - '.github/workflows/shared-studio-connect.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node studio-connect/tests.mjs
